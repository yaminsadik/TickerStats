<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-label="TickerStats" role="img">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0F172A" />
			<stop offset="100%" stop-color="#1E40AF" />
		</linearGradient>
		<linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#38BDF8" />
			<stop offset="100%" stop-color="#22C55E" />
		</linearGradient>
		<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1220" flood-opacity="0.4" />
		</filter>
	</defs>

	<rect width="128" height="128" rx="28" fill="url(#bg)" />
	<rect x="10" y="10" width="108" height="108" rx="22" fill="#0B1220" opacity="0.75" />

	<!-- Subtle grid -->
	<g stroke="#1F2937" stroke-width="1" opacity="0.45">
		<path d="M20 32h88" />
		<path d="M20 52h88" />
		<path d="M20 72h88" />
		<path d="M20 92h88" />
	</g>

	<!-- Rising trend line -->
	<path
		d="M22 84 L44 66 L60 74 L78 50 L106 40"
		fill="none"
		stroke="url(#line)"
		stroke-width="6"
		stroke-linecap="round"
		stroke-linejoin="round"
		filter="url(#soft)"
	/>

	<!-- Highlight nodes -->
	<g fill="#E2E8F0">
		<circle cx="44" cy="66" r="3" />
		<circle cx="78" cy="50" r="3" />
		<circle cx="106" cy="40" r="3" />
	</g>
</svg>
