<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-label="TickerStats" role="img">
  <!-- Rounded background -->
  <rect width="128" height="128" rx="28" fill="#0B1220" />

  <!-- Upward trend line -->
  <polyline
    points="24,92 52,68 76,80 104,36"
    fill="none"
    stroke="#22C55E"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Arrow head at the peak -->
  <polyline
    points="86,36 104,36 104,54"
    fill="none"
    stroke="#22C55E"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
